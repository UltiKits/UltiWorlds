# UltiWorlds Language File - English
# Version 2.0.0

# ==================== Plugin Status ====================
worlds_enabled: "§aUltiWorlds has been enabled!"

# ==================== Common ====================
common:
  enabled: "Enabled"
  disabled: "Disabled"
  "yes": "Yes"
  "no": "No"
  random: "Random"

# ==================== Error Messages ====================
error:
  world_not_found: "§cWorld %world% does not exist!"
  world_blocked: "§cThis world has been blocked!"
  world_locked: "§cThis world is locked and cannot be entered!"
  no_permission: "§cYou don't have permission to enter this world!"
  cooldown: "§cTeleport cooldown! Please wait %time% seconds"
  invalid_value: "§cInvalid value!"
  invalid_difficulty: "§cInvalid difficulty! Use: PEACEFUL, EASY, NORMAL, HARD"

# ==================== Success Messages ====================
success:
  teleported: "§aTeleported to world: %world%"
  difficulty_set: "§aDifficulty set to %value% for world %world%"
  post_cmd_added: "§aPost-teleport command added for world %world%"
  post_cmd_cleared: "§aAll post-teleport commands cleared for world %world%"
  post_cmd_list_header: "§6Post-teleport commands for %world%:"
  post_cmd_list_item: "§7- §f%command%"
  post_cmd_empty: "§7No post-teleport commands configured"
  world_unloading_tp: "§eWorld is being unloaded, you have been teleported to the default world"

# ==================== Protection Messages ====================
protection:
  break_denied: "§cBlock breaking is protected in this world!"
  place_denied: "§cBlock placing is protected in this world!"
  interact_denied: "§cInteraction is protected in this world!"
  pvp_disabled: "§cPVP is disabled in this world!"

