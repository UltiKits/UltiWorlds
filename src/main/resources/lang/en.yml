  loaded: "§aWorld %world% has been loaded!"
  unloaded: "§eWorld %world% has been unloaded"
  spawn_set: "§aWorld spawn point has been set"
  setting_updated: "§aSetting updated: %option% = %value%"
  protection_enabled: "§aWorld protection enabled"
  protection_disabled: "§eWorld protection disabled"
  world_blocked: "§cWorld %world% has been blocked"
  world_unblocked: "§aWorld %world% has been unblocked"
  difficulty_set: "§aDifficulty set to %value% for world %world%"
  post_cmd_added: "§aPost-teleport command added for world %world%"
