  morning: "Morning"
  noon: "Noon"
  evening: "Evening"
  night: "Night"

# ==================== Weather ====================
weather:
  clear: "Clear"
  rain: "Rain"
  thunder: "Thunder"

# ==================== Wizard ====================
wizard:
  header: "§6========== World Creation Wizard =========="
  cancel_hint: "§7Type 'cancel' to abort at any time"
  
  enter_name: "§ePlease enter the new world name §7(letters, numbers, underscore, hyphen only):"
  invalid_name: "§cInvalid world name! Only letters, numbers, underscores and hyphens allowed, 1-32 characters"
  world_exists: "§cA world with that name already exists! Please use a different name"
  
  select_environment: "§ePlease select world environment:"
  invalid_environment: "§cInvalid choice! Please enter 1, 2, or 3"
  
  select_type: "§ePlease select world type:"
  invalid_type: "§cInvalid choice! Please enter 1-4"
  
  generate_structures: "§eGenerate structures (villages, temples, etc.)?"
  invalid_yn: "§cInvalid input! Please enter y(yes) or n(no)"
  
  enter_seed: "§ePlease enter world seed §7(leave empty or 'random' for random seed):"
  
  confirm_header: "§6========== Confirm Creation =========="
  confirm_name: "World Name:"
  confirm_env: "Environment:"
  confirm_type: "Type:"
  confirm_structures: "Structures:"
  confirm_seed: "Seed:"
  confirm_question: "§eConfirm creating this world?"
  
  creating: "§6Creating world, please wait..."
  success: "§a✓ World %world% created successfully! Teleporting..."
  failed: "§c✗ Failed to create world %world%"
  error: "§cError creating world: %error%"
  
  timeout: "§cOperation timed out, world creation cancelled"
  cancelled: "§eWorld creation cancelled"

# ==================== World Command Messages ====================
# Referenced via the "world.*" keys the /world command's handlers call directly
# (as opposed to the flat "error.*"/"success.*" keys the older handlers use).
world:
  not_found: "§cWorld {WORLD} does not exist!"

  list:
    header: "§6World List ({COUNT} total):"
    item: "§7- §f{NAME} §7({PLAYERS} players)"

  tp:
    disabled: "§cTeleporting to worlds via this command is disabled!"

  create:
    exists: "§cWorld {WORLD} already exists!"
    creating: "§6Creating world {WORLD}, please wait..."
    success: "§aWorld {WORLD} has been created!"
    failed: "§cFailed to create the world!"
    invalid_type: "§cInvalid world type! Use: NORMAL, NETHER, THE_END"

  load:
    success: "§aWorld {WORLD} has been loaded!"
    failed: "§cFailed to load the world!"

  unload:
    default: "§cCannot unload the default world!"
    success: "§eWorld {WORLD} has been unloaded"
    failed: "§cFailed to unload the world!"

  delete:
    default: "§cCannot delete the default world!"
    protected: "§cWorld {WORLD} is listed in protected_worlds and cannot be deleted!"
    deleting: "§6Deleting world {WORLD}, please wait..."
    success: "§cWorld {WORLD} has been deleted!"
    failed: "§cFailed to delete the world!"
    confirm_console: "§eWorld {WORLD} will be deleted permanently. Run /world delete {WORLD} again within {SECONDS} seconds to confirm."
    expired: "§cThis confirmation for world {WORLD} expired after {SECONDS} seconds, so nothing was deleted. Run /world delete {WORLD} again."
    invalidated: "§cWorld {WORLD} was deleted after this confirmation was requested, so nothing was deleted. Run /world delete {WORLD} again to delete what is there now."
    sender_not_allowed: "§cOnly a player or the server console can delete a world."

  set:
    invalid_option: "§cInvalid option! Use: pvp, monsters, animals, weather, hidden, locked, blocked, displayname, description, icon, difficulty"
    success: "§aSet {OPTION} = {VALUE} for world {WORLD}"

  protect:
    enabled: "§aFull protection enabled for world {WORLD}"
    disabled: "§eAll protection disabled for world {WORLD}"

  block:
    kicked: "§cWorld {WORLD} has been blocked, you have been teleported out"
    enabled: "§cWorld {WORLD} has been blocked"
    disabled: "§aWorld {WORLD} has been unblocked"

  setspawn:
    success: "§aSpawn point set for world {WORLD}"

  info:
    header: "§6========== World Info =========="
    name: "§7Name: §f{VALUE}"
    displayname: "§7Display Name: §f{VALUE}"
    environment: "§7Environment: §f{VALUE}"
    seed: "§7Seed: §f{VALUE}"
    players: "§7Players: §f{VALUE}"
    pvp: "§7PVP: §f{VALUE}"
    monsters: "§7Monsters: §f{VALUE}"
    protection: "§7Protection: §f{VALUE}"
    blocked: "§7Blocked: §f{VALUE}"

# ==================== Help Menu ====================
# Referenced by WorldCommand#help() via the "help.*" keys; the admin block also shows the
# four "command.help.*" lines below.
help:
  header: "§6========== UltiWorlds Help =========="
  list: "§e/world list §7- List all loaded worlds"
  tp: "§e/world tp <world> §7- Teleport to a world"
  info: "§e/world info §7- Show info about the current world"
  wizard: "§e/world wizard §7- Start the world creation wizard"
  admin_header: "§6========== Admin Commands =========="
  create: "§e/world create <name> [type] §7- Create a world (type: NORMAL, NETHER, THE_END)"
  load: "§e/world load <world> §7- Load a world"
  unload: "§e/world unload <world> §7- Unload a world"
  delete: "§e/world delete <world> §7- Delete a world (asks for confirmation first)"
  delete_console: "§e/world delete <world> §7- Delete a world; run the same command again within {SECONDS} seconds to confirm"
  setspawn: "§e/world setspawn §7- Set the current world's spawn point"
  set: "§e/world set <world> <option> <value> §7- Modify world settings"
  protect: "§e/world protect <world> §7- Enable full protection for a world"
  block: "§e/world block <world> §7- Block access to a world"

# ==================== Command Help ====================
command:
  description: "World management"
  help:
    unprotect: "§e/world unprotect <world> §7- Disable all protection"
    unblock: "§e/world unblock <world> §7- Unblock world access"
    difficulty: "§e/world difficulty <world> <level> §7- Set world difficulty"
    postcmd: "§e/world postcmd <world> <add|list|clear> §7- Manage post-TP commands"

  # Delete
  delete:
    success: "§aWorld %world% has been deleted"
    failed: "§cFailed to delete world %world%"
    cancelled: "§eDelete operation cancelled"

# ==================== Console Messages ====================
log:
  auto_unload: "Auto-unloading empty world: {WORLD}"
  invalid_difficulty: "Invalid difficulty for world {WORLD}: {VALUE}"
  settings_update_failed: "Failed to update world settings"
  environment:
    inferred: "World '{WORLD}': this module supplies {ENVIRONMENT} as the environment to load with, because its folder contains a top-level '{ENTRY}' directory and no top-level 'region' directory. What each of these folder shapes means, and what can be done about it, is in this module's CHANGELOG.md changelog entry for this version, and in UltiKits/UltiWorlds#22."
    none: "World '{WORLD}': this module supplies no environment, because {OBSERVATION}. It does not guess an environment it cannot read from the folder, so the server's own default applies -- the same as before this version. What each of these folder shapes means, and what can be done about it, is in this module's CHANGELOG.md changelog entry for this version, and in UltiKits/UltiWorlds#22."
    observation:
      dangling_link: "its '{ENTRY}' entry is a symbolic link that does not lead to a directory, so the folder cannot be read as the world it may belong to"
      dimension_link: "its dimension entry is a symbolic link, and this module does not follow links when reading a world folder, so whatever the link points at was not read"
      both_dimensions: "its folder contains both a top-level 'DIM-1' directory and a top-level 'DIM1' directory"
      dimension_and_region: "its folder contains a top-level '{ENTRY}' directory and a top-level 'region' directory, each holding a different world's terrain"
  delete:
    refused_protected: "Refused to delete world {WORLD}: it is the configured default_world or is listed in protected_worlds."
    symbolic_link: "World '{WORLD}' is a symbolic link, not a world folder. Only the link entry is subject to this command; nothing it points at is read or deleted."
    link_remove_failed: "Failed to remove the symbolic link for world {WORLD}; the link is still in the world container. Settings for this world were kept."
    folder_remove_failed: "Failed to fully delete the folder for world {WORLD}; some files remain on disk. Settings for this world were kept."
  inventory:
    save_failed: "Failed to save inventory for {PLAYER}"
    load_failed: "Failed to load inventory for {PLAYER}"

# ==================== Removed Configuration Keys ====================
log_removed_key_check_failed: "Could not check {FILE} for removed configuration keys; the module continues without that check."
removed_key_warning: "{FILE} still contains '{KEY}', which this version of UltiWorlds no longer reads. {REASON} Delete the key from the file to silence this warning."
removed_key_reason_gui_title: "Nothing ever read it: the world list's title comes from this module's language file (gui.title in lang/en.yml, lang/zh.yml), which is where to change it."
removed_key_reason_message: "Nothing ever read it: every world message comes from this module's language file (lang/en.yml, lang/zh.yml), which is where to change it."
