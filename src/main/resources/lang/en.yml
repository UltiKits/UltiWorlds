# UltiWorlds Language File - English
# Version 2.0.0

# ==================== Plugin Status ====================
worlds_enabled: "§aUltiWorlds has been enabled!"
worlds_disabled: "§cUltiWorlds has been disabled!"

# ==================== Common ====================
common:
  enabled: "Enabled"
  disabled: "Disabled"
  "yes": "Yes"
  "no": "No"
  random: "Random"
  on: "On"
  off: "Off"

# ==================== Error Messages ====================
error:
  world_not_found: "§cWorld %world% does not exist!"
  world_exists: "§cWorld %world% already exists!"
  world_blocked: "§cThis world has been blocked!"
  world_locked: "§cThis world is locked and cannot be entered!"
  no_permission: "§cYou don't have permission to enter this world!"
  cooldown: "§cTeleport cooldown! Please wait %time% seconds"
  delete_protected: "§cCannot delete a protected world!"
  invalid_world: "§cInvalid world name!"
  invalid_option: "§cInvalid option! Available options: %options%"
  invalid_value: "§cInvalid value!"
  not_player: "§cThis command can only be executed by players!"
  invalid_difficulty: "§cInvalid difficulty! Use: PEACEFUL, EASY, NORMAL, HARD"

# ==================== Success Messages ====================
success:
  teleported: "§aTeleported to world: %world%"
