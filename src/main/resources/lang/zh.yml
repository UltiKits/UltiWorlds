# UltiWorlds 语言文件 - 简体中文
# Version 2.0.0

# ==================== 插件状态 ====================
worlds_enabled: "§aUltiWorlds 已启用！"

# ==================== 通用 ====================
common:
  enabled: "已启用"
  disabled: "已禁用"
  "yes": "是"
  "no": "否"
  random: "随机"

# ==================== 错误消息 ====================
error:
  world_not_found: "§c世界 %world% 不存在！"
  world_blocked: "§c此世界已被禁止进入！"
  world_locked: "§c此世界已被锁定，无法进入！"
  no_permission: "§c你没有权限进入此世界！"
  cooldown: "§c传送冷却中！请等待 %time% 秒"
  invalid_value: "§c无效的值！"
  invalid_difficulty: "§c无效的难度！可用: PEACEFUL, EASY, NORMAL, HARD"

# ==================== 成功消息 ====================
success:
  teleported: "§a已传送到世界: %world%"
  difficulty_set: "§a已设置世界 %world% 的难度为 %value%"
  post_cmd_added: "§a已为世界 %world% 添加传送后命令"
  post_cmd_cleared: "§a已清除世界 %world% 的所有传送后命令"
  post_cmd_list_header: "§6世界 %world% 的传送后命令:"
  post_cmd_list_item: "§7- §f%command%"
  post_cmd_empty: "§7未配置传送后命令"
  world_unloading_tp: "§e世界正在卸载，你已被传送到主世界"

# ==================== 保护消息 ====================
protection:
  break_denied: "§c此世界已启用方块破坏保护！"
  place_denied: "§c此世界已启用方块放置保护！"
  interact_denied: "§c此世界已启用交互保护！"
  pvp_disabled: "§c此世界已禁用 PVP！"

# ==================== GUI ====================
gui:
  title: "§6世界列表"
  environment: "§7环境:"
  players: "§7玩家数:"
  time: "§7时间:"
  weather: "§7天气:"
  pvp: "§7PVP:"
  monsters: "§7怪物:"
  protected: "保护中"
  locked: "已锁定"
  blocked: "已禁止"
  click_to_tp: "点击传送到此世界"
  
  delete:
    title: "§c确认删除: %world%"

# ==================== 环境名称 ====================
environment:
  normal: "主世界"
  nether: "下界"
  the_end: "末地"

# ==================== 世界类型 ====================
type:
  normal: "标准"
  flat: "超平坦"
  amplified: "放大化"
  large_biomes: "巨型生物群系"

# ==================== 时间 ====================
time:
  morning: "早晨"
  noon: "正午"
  evening: "傍晚"
  night: "夜晚"

# ==================== 天气 ====================
weather:
  clear: "晴朗"
  rain: "雨天"
  thunder: "雷暴"

# ==================== 向导 ====================
wizard:
  header: "§6========== 世界创建向导 =========="
  cancel_hint: "§7输入 'cancel' 随时取消"
  
  enter_name: "§e请输入新世界的名称 §7(仅限字母、数字、下划线和连字符):"
  invalid_name: "§c无效的世界名称！只允许字母、数字、下划线和连字符，长度1-32字符"
  world_exists: "§c同名世界已存在！请使用其他名称"
  
  select_environment: "§e请选择世界环境:"
  invalid_environment: "§c无效的选择！请输入 1、2 或 3"
  
  select_type: "§e请选择世界类型:"
  invalid_type: "§c无效的选择！请输入 1-4"
  
  generate_structures: "§e是否生成建筑物（村庄、神殿等）？"
  invalid_yn: "§c无效输入！请输入 y(是) 或 n(否)"
  
  enter_seed: "§e请输入世界种子 §7(留空或输入 'random' 使用随机种子):"
  
  confirm_header: "§6========== 确认创建 =========="
  confirm_name: "世界名称:"
  confirm_env: "环境:"
  confirm_type: "类型:"
  confirm_structures: "生成建筑:"
  confirm_seed: "种子:"
  confirm_question: "§e确认创建此世界吗？"
  
  creating: "§6正在创建世界，请稍候..."
  success: "§a✓ 世界 %world% 创建成功！已传送至该世界"
  failed: "§c✗ 创建世界 %world% 失败"
  error: "§c创建世界时发生错误: %error%"
  
  timeout: "§c操作超时，世界创建已取消"
  cancelled: "§e世界创建已取消"

# ==================== 世界命令消息 ====================
# 由 /world 命令的处理器直接调用的 "world.*" key（区别于旧处理器使用的
# 扁平 "error.*"/"success.*" key）。
world:
  not_found: "§c世界 {WORLD} 不存在！"

  list:
    header: "§6世界列表（共 {COUNT} 个）："
    item: "§7- §f{NAME} §7（{PLAYERS} 名玩家）"

  tp:
    disabled: "§c此命令的传送功能已被禁用！"

  create:
    exists: "§c世界 {WORLD} 已存在！"
    creating: "§6正在创建世界 {WORLD}，请稍候..."
    success: "§a世界 {WORLD} 已创建！"
    failed: "§c创建世界失败！"
    invalid_type: "§c无效的世界类型！可用：NORMAL、NETHER、THE_END"

  load:
    success: "§a世界 {WORLD} 已加载！"
    failed: "§c加载世界失败！"

  unload:
    default: "§c无法卸载默认世界！"
    success: "§e世界 {WORLD} 已卸载"
    failed: "§c卸载世界失败！"

  delete:
    default: "§c无法删除默认世界！"
    protected: "§c世界 {WORLD} 已列入 protected_worlds，无法删除！"
    deleting: "§6正在删除世界 {WORLD}，请稍候..."
    success: "§c世界 {WORLD} 已删除！"
    failed: "§c删除世界失败！"
    confirm_console: "§e世界 {WORLD} 将被永久删除。请在 {SECONDS} 秒内再次执行 /world delete {WORLD} 以确认。"
    expired: "§c世界 {WORLD} 的删除确认已超过 {SECONDS} 秒失效，因此没有删除任何内容。请重新执行 /world delete {WORLD}。"
    invalidated: "§c在请求此确认之后，世界 {WORLD} 已被删除，因此没有删除任何内容。如需删除该名称下现有的世界，请重新执行 /world delete {WORLD}。"
    sender_not_allowed: "§c只有玩家或服务器控制台可以删除世界。"

  set:
    invalid_option: "§c无效的选项！可用：pvp、monsters、animals、weather、hidden、locked、blocked、displayname、description、icon、difficulty"
    success: "§a已将世界 {WORLD} 的 {OPTION} 设置为 {VALUE}"

  protect:
    enabled: "§a已为世界 {WORLD} 启用完整保护"
    disabled: "§e已禁用世界 {WORLD} 的所有保护"

  block:
    kicked: "§c世界 {WORLD} 已被禁止进入，你已被传送出该世界"
    enabled: "§c世界 {WORLD} 已被禁止进入"
    disabled: "§a世界 {WORLD} 已允许进入"

  setspawn:
    success: "§a已设置世界 {WORLD} 的出生点"

  info:
    header: "§6========== 世界信息 =========="
    name: "§7名称: §f{VALUE}"
    displayname: "§7显示名称: §f{VALUE}"
    environment: "§7环境: §f{VALUE}"
    seed: "§7种子: §f{VALUE}"
    players: "§7玩家数: §f{VALUE}"
    pvp: "§7PVP: §f{VALUE}"
    monsters: "§7怪物: §f{VALUE}"
    protection: "§7保护: §f{VALUE}"
    blocked: "§7已禁止: §f{VALUE}"

# ==================== 帮助菜单 ====================
# 由 WorldCommand#help() 通过 "help.*" key 调用；管理员部分还会显示下方四条
# "command.help.*"。
help:
  header: "§6========== UltiWorlds 帮助 =========="
  list: "§e/world list §7- 列出所有已加载的世界"
  tp: "§e/world tp <世界> §7- 传送到指定世界"
  info: "§e/world info §7- 查看当前世界的信息"
  wizard: "§e/world wizard §7- 启动世界创建向导"
  admin_header: "§6========== 管理员命令 =========="
  create: "§e/world create <名称> [类型] §7- 创建世界（类型：NORMAL、NETHER、THE_END）"
  load: "§e/world load <世界> §7- 加载世界"
  unload: "§e/world unload <世界> §7- 卸载世界"
  delete: "§e/world delete <世界> §7- 删除世界（会先请求确认）"
  delete_console: "§e/world delete <世界> §7- 删除世界；请在 {SECONDS} 秒内再次执行同一条命令以确认"
  setspawn: "§e/world setspawn §7- 设置当前世界的出生点"
  set: "§e/world set <世界> <选项> <值> §7- 修改世界设置"
  protect: "§e/world protect <世界> §7- 为世界启用完整保护"
  block: "§e/world block <世界> §7- 禁止进入世界"

# ==================== 命令帮助 ====================
command:
  description: "世界管理系统"
  help:
    unprotect: "§e/world unprotect <世界> §7- 禁用所有保护"
    unblock: "§e/world unblock <世界> §7- 允许进入世界"
    difficulty: "§e/world difficulty <世界> <难度> §7- 设置世界难度"
    postcmd: "§e/world postcmd <世界> <add|list|clear> §7- 管理传送后命令"

  # 删除
  delete:
    success: "§a世界 %world% 已删除"
    failed: "§c删除世界 %world% 失败"
    cancelled: "§e已取消删除操作"

# ==================== 控制台消息 ====================
log:
  auto_unload: "正在自动卸载无人的世界：{WORLD}"
  invalid_difficulty: "世界 {WORLD} 的难度无效：{VALUE}"
  settings_update_failed: "更新世界设置失败"
  environment:
    inferred: "世界 '{WORLD}'：本模块以 {ENVIRONMENT} 作为加载时的环境，因为其文件夹包含顶层 '{ENTRY}' 目录，且没有顶层 'region' 目录。这些文件夹形态各自意味着什么、可以怎么处理，见本模块 CHANGELOG.md 中本版本的变更条目，以及 UltiKits/UltiWorlds#22。"
    none: "世界 '{WORLD}'：本模块不提供环境，因为{OBSERVATION}。本模块不会猜测无法从文件夹读出的环境，因此使用服务器自身的默认值——与本版本之前相同。这些文件夹形态各自意味着什么、可以怎么处理，见本模块 CHANGELOG.md 中本版本的变更条目，以及 UltiKits/UltiWorlds#22。"
    observation:
      dangling_link: "其 '{ENTRY}' 条目是一个不指向目录的符号链接，因此无法把该文件夹读作它可能所属的世界"
      dimension_link: "其维度条目是一个符号链接，而本模块读取世界文件夹时不跟随链接，因此链接所指向的内容没有被读取"
      both_dimensions: "其文件夹同时包含顶层 'DIM-1' 目录和顶层 'DIM1' 目录"
      dimension_and_region: "其文件夹同时包含顶层 '{ENTRY}' 目录和顶层 'region' 目录，二者各自保存着不同世界的地形"
  delete:
    refused_protected: "已拒绝删除世界 {WORLD}：它是配置的 default_world，或列在 protected_worlds 中。"
    symbolic_link: "世界 '{WORLD}' 是一个符号链接，而不是世界文件夹。本命令只作用于该链接条目本身；它指向的任何内容都不会被读取或删除。"
    link_remove_failed: "移除世界 {WORLD} 的符号链接失败；该链接仍在世界容器中。已保留此世界的设置。"
    folder_remove_failed: "未能完整删除世界 {WORLD} 的文件夹；部分文件仍留在磁盘上。已保留此世界的设置。"
  removed_key_check_failed: "无法检查 {FILE} 中已移除的配置键；模块将跳过这项检查继续运行。"
  inventory:
    save_failed: "保存 {PLAYER} 的背包失败"
    load_failed: "加载 {PLAYER} 的背包失败"

# ==================== 已移除的配置键 ====================
removed_key_warning: "{FILE} 仍包含 '{KEY}'，当前版本的 UltiWorlds 已不再读取该键。{REASON} 从文件中删除该键即可消除此警告。"
removed_key_reason_gui_title: "从未有代码读取它：世界列表的标题来自本模块的语言文件（lang/en.yml、lang/zh.yml 中的 gui.title），要修改请改那里。"
removed_key_reason_message: "从未有代码读取它：所有世界相关消息都来自本模块的语言文件（lang/en.yml、lang/zh.yml），要修改请改那里。"
